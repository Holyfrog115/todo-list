<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <div id="brand">
            <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px"><path d="m424-312 282-282-56-56-226 226-114-114-56 56 170 170ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg>
            <h1>Todo List</h1>
        </div>
        <div id="navigation-main">
            <nav>
                <ul>
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-120H640q-30 38-71.5 59T480-240q-47 0-88.5-21T320-320H200v120Zm349-142q31-22 43-58h168v-360H200v360h168q12 36 43 58t69 22q38 0 69-22ZM200-200h560-560Z"/></svg>
                        <div class="folder-name">Inbox</div>
                        <div id="inbox-tasks-counter" class="tasks-counter"></div>
                    </li>
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/></svg>
                        <div class="folder-name">Today</div>
                        <div id="today-tasks-counter" class="tasks-counter"></div>
                    </li>
                </ul>
            </nav>
        </div>
        <div id="projects-tree">
            <div class="projects-heading">
                <button id="hide-projects">
                    <svg id="down-arrow" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z"/></svg>
                    <svg id="right-arrow" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg>
                </button>
                <h2>Projects</h2>
                <button id="new-project">
                    <svg xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 -960 960 960" width="28px"><path d="M440-120v-320H120v-80h320v-320h80v320h320v80H520v320h-80Z"/></svg>
                </button>
            </div>
            <nav>
                <ul id="projects-list">
                </ul>
            </nav>
        </div>
        
    </div>
    <div id="main-container">
        <div id="top-bar">
            <input type="search" placeholder="Search tasks...">
            <div class="buttons-container">
                <button id="delete-project">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M200-440v-80h560v80H200Z"/></svg>
                    Delete Project
                </button>
                <button id="add-task">
                    <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px"><path d="M440-120v-320H120v-80h320v-320h80v320h320v80H520v320h-80Z"/></svg>
                    Add Task
                </button>
            </div>
        </div>
        <div id="tasks-section">
            <div id="header-block">
                <h2></h2>
                <div id="active-items"></div>
            </div>
            <div class="tasks-block">
                <div id="pending-tasks" class="tasks-list">
                    <div class="heading">
                        <h3>PENDING TASKS</h3>
                    </div>
                    <div class="tasks">
                        <ul>
                        </ul>
                    </div>
                </div>
                <div id="completed-tasks" class="tasks-list">
                    <div class="heading">
                        <h3>COMPLETED TASKS</h3>
                    </div>
                    <div class="tasks">
                        <ul>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New project form -->
    <dialog id="new-project-dialog">
        <form method="dialog" id="new-project-form">
            <h2>New Project</h2>
            <fieldset>
                <div>
                    <label for="projectTitle">Title:</label>
                    <input type="text" name="projectTitle" id="projectTitle" autocomplete="off" required minlength="2" maxlength="15">
                </div>
            </fieldset>
            <div class="dialog-buttons">
                <button type="button" value="cancel" formmethod="dialog">Cancel</button>
                <button id="confirmBtn" value="default">Add</button>
            </div>
        </form>
    </dialog>

    <!-- New task form -->
    <dialog id="new-task-dialog">
        <form method="dialog" id="new-task-form">
            <h2>New Task</h2>
            <fieldset>

                <div>
                    <label for="taskTitle">Title: <span class="required">*</span></label>
                    <input type="text" name="taskTitle" id="taskTitle" autocomplete="off" required minlength="2" maxlength="15">
                </div>

                <div>
                    <label for="taskDueDate">Due Date: <span class="required">*</span></label>
                    <input type="date" name="taskDueDate" id="taskDueDate" required>
                </div>

                <div>
                    <label for="taskPriority">Priority: <span class="required">*</span></label>
                    <select name="taskPriority" id="taskPriority">
                        <option value="0">None</option>
                        <option value="3">High</option>
                        <option value="2">Medium</option>
                        <option value="1">Low</option>
                    </select>
                </div>

                <div>
                    <label for="taskDescription">Description:</label>
                    <textarea name="taskDescription" id="taskDescription" rows="4" cols="50"></textarea>
                </div>

            </fieldset>
            <div class="dialog-buttons">
                <button type="button" value="cancel" formmethod="dialog">Cancel</button>
                <button id="confirmBtn" value="default">Add</button>
            </div>
        </form>
    </dialog>
</body>
</html>
